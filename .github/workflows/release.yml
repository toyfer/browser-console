name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.3.1). Leave empty on tag push."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.1"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & bundle app
        shell: bash
        run: |
          npm install
          npm run build:app
          test -f dist/app.cjs
          test -f public/vendor/xterm.js
          test -f public/vendor/xterm.css
          test -f public/vendor/addon-fit.js
          test -f public/vendor/addon-web-links.js
          test -f public/vendor/addon-unicode11.js

      # Windows runners: avoid Unix /tmp paths (Python on Windows cannot open them).
      # Use RUNNER_TEMP + PowerShell throughout this job.
      - name: Assemble Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:NODE_VERSION
          $pkg = Join-Path $pwd "dist\pkg\browser-console-windows"
          $runtime = Join-Path $pkg "runtime"
          $app = Join-Path $pkg "app"
          $appPublic = Join-Path $app "public"
          $release = Join-Path $pwd "dist\release"
          New-Item -ItemType Directory -Force -Path $runtime, $app, $appPublic, $release | Out-Null

          $tmp = $env:RUNNER_TEMP
          $zipPath = Join-Path $tmp "node-win.zip"
          $extractDir = Join-Path $tmp "node-win"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $nodeRoot = Get-ChildItem $extractDir -Directory | Where-Object { $_.Name -like "node-v*" } | Select-Object -First 1
          if (-not $nodeRoot) { throw "node extract root not found" }
          Copy-Item (Join-Path $nodeRoot.FullName "node.exe") (Join-Path $runtime "node.exe") -Force
          Write-Host "node.exe ok: $((Get-Item (Join-Path $runtime 'node.exe')).Length) bytes"

          Copy-Item "dist\app.cjs" (Join-Path $app "app.cjs") -Force
          Copy-Item "public\*" $appPublic -Recurse -Force
          if (-not (Test-Path (Join-Path $appPublic "vendor\xterm.js"))) { throw "app/public/vendor/xterm.js missing" }
          Copy-Item "shell.windows.json" (Join-Path $pkg "shell.json") -Force
          if (Test-Path README.md) { Copy-Item README.md $pkg -Force }
          if (Test-Path LICENSE) { Copy-Item LICENSE $pkg -Force }

          # Production native deps (ConPTY)
          @{
            name = "browser-console-runtime"
            private = $true
            dependencies = @{
              "@homebridge/node-pty-prebuilt-multiarch" = "0.14.1"
              "ws" = "8.18.0"
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $app "package.json") -Encoding utf8
          Push-Location $app
          try {
            npm install --omit=dev
            if ($LASTEXITCODE -ne 0) { throw "npm install failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          # Tiny native launcher exe (no START.bat)
          $exeOut = Join-Path $pkg "browser-console.exe"
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            # GitHub windows-latest usually has mingw via choco or Git; install if missing
            Write-Host "gcc not found; installing mingw via choco..."
            choco install mingw -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
            $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          }
          if (-not $gcc) { throw "gcc still not available after choco install" }
          Write-Host "Using gcc: $($gcc.Source)"
          & gcc -O2 -s -mconsole "src\launcher.c" -o $exeOut
          if ($LASTEXITCODE -ne 0) { throw "gcc failed: $LASTEXITCODE" }
          if (-not (Test-Path $exeOut)) { throw "browser-console.exe not produced" }
          Write-Host "launcher exe: $((Get-Item $exeOut).Length) bytes"

          Get-ChildItem $pkg | Format-Table Name, Length
          Get-ChildItem (Join-Path $appPublic "vendor") | Format-Table Name, Length

          $outZip = Join-Path $release "browser-console-windows-x64.zip"
          if (Test-Path $outZip) { Remove-Item $outZip -Force }
          # Compress contents (not the parent folder name)
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath $outZip -Force
          Write-Host "zip: $((Get-Item $outZip).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/browser-console-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & bundle app
        run: |
          npm install
          npm run build:app
          test -f public/vendor/xterm.js
          test -f public/vendor/xterm.css
          test -f public/vendor/addon-fit.js
          test -f public/vendor/addon-web-links.js
          test -f public/vendor/addon-unicode11.js

      - name: Assemble Linux package
        run: |
          set -euo pipefail
          PKG=dist/pkg/browser-console-linux-x64
          mkdir -p "$PKG/runtime" "$PKG/app/public" "$RUNNER_TEMP"

          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o "$RUNNER_TEMP/node-linux.tar.xz"
          tar -xJf "$RUNNER_TEMP/node-linux.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/node-v${NODE_VERSION}-linux-x64/bin/node" "$PKG/runtime/node"
          chmod +x "$PKG/runtime/node"

          cp dist/app.cjs "$PKG/app/app.cjs"
          cp -R public/. "$PKG/app/public/"
          test -f "$PKG/app/public/vendor/xterm.js"
          cp shell.linux.json "$PKG/shell.json"
          cp scripts/unix-launcher.sh "$PKG/browser-console"
          chmod +x "$PKG/browser-console"
          cp README.md LICENSE "$PKG/" 2>/dev/null || true

          pushd "$PKG/app" >/dev/null
          cat > package.json <<'JSON'
          {
            "name": "browser-console-runtime",
            "private": true,
            "dependencies": {
              "@homebridge/node-pty-prebuilt-multiarch": "0.14.1",
              "ws": "8.18.0"
            }
          }
          JSON
          npm install --omit=dev
          popd >/dev/null

          mkdir -p dist/release
          tar -C dist/pkg -czf dist/release/browser-console-linux-x64.tar.gz browser-console-linux-x64
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/release/browser-console-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & bundle app
        run: |
          npm install
          npm run build:app
          test -f public/vendor/xterm.js
          test -f public/vendor/xterm.css
          test -f public/vendor/addon-fit.js
          test -f public/vendor/addon-web-links.js
          test -f public/vendor/addon-unicode11.js

      - name: Assemble macOS package
        run: |
          set -euo pipefail
          PKG=dist/pkg/browser-console-macos-arm64
          mkdir -p "$PKG/runtime" "$PKG/app/public"

          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o "$RUNNER_TEMP/node-mac.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-mac.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/node-v${NODE_VERSION}-darwin-arm64/bin/node" "$PKG/runtime/node"
          chmod +x "$PKG/runtime/node"

          cp dist/app.cjs "$PKG/app/app.cjs"
          cp -R public/. "$PKG/app/public/"
          test -f "$PKG/app/public/vendor/xterm.js"
          cp shell.macos.json "$PKG/shell.json"
          cp scripts/unix-launcher.sh "$PKG/browser-console"
          chmod +x "$PKG/browser-console"
          cp README.md LICENSE "$PKG/" 2>/dev/null || true

          pushd "$PKG/app" >/dev/null
          cat > package.json <<'JSON'
          {
            "name": "browser-console-runtime",
            "private": true,
            "dependencies": {
              "@homebridge/node-pty-prebuilt-multiarch": "0.14.1",
              "ws": "8.18.0"
            }
          }
          JSON
          npm install --omit=dev
          popd >/dev/null

          mkdir -p dist/release
          tar -C dist/pkg -czf dist/release/browser-console-macos-arm64.tar.gz browser-console-macos-arm64
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/release/browser-console-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Match v1.3.0 and also accidental v.1.3.0
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -v {} release-assets/ \;
          ls -la release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Browser Console ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Portable packages (**no START.bat**, **no CDN**).

            Air-gapped: unpack and run. xterm.js is shipped in `app/public/vendor`.

            | Asset | Platform |
            |---|---|
            | `browser-console-windows-x64.zip` | Windows x64 — run `browser-console.exe` |
            | `browser-console-linux-x64.tar.gz` | Linux x64 — run `./browser-console` |
            | `browser-console-macos-arm64.tar.gz` | macOS arm64 — run `./browser-console` |

            Unpack **keeping the folder structure**. Put `shell.json` next to the launcher.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
